<!DOCTYPE html>
<html lang="{{ browser_lang }}">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="">
    <link rel="icon" type="image/png" href="{{ instance }}/static/favicon.png">
    <link href="{{ instance }}/static/react-dist/assets/main.css" rel="stylesheet">
    {% if theme %}<link href="{{ instance }}/{{ theme }}" rel="stylesheet">{% endif %}
    {% if custom_css %}<link href="{{ instance }}/{{ custom_css }}" rel="stylesheet">{% endif %}
    <title>{{ page_title }}</title>
</head>
<body>
<div id="react-root"></div>
<!-- Page settings the React client reads once (lib/uiConfig.ts). -->
<script id="edumfa-ui-config" type="application/json">{{ ui_config|tojson }}</script>
<!-- The U2F JavaScript API shim used by U2F tokens in browsers that still offer it. -->
<script src="{{ instance }}/static/contrib/js/u2f-api.js"></script>
<script type="module" src="{{ instance }}/static/react-dist/assets/main.js"></script>
</body>
</html>
