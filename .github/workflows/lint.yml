name: lint

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, reopened, synchronize ]

jobs:
  prettier:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edumfa/static
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - name: Check frontend formatting
        run: bun run format:check

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Get Ruff version
        id: ruff-version
        run: echo "version=$(grep -Po '(?<=ruff==)[0-9]+\.[0-9]+\.[0-9]+' pyproject.toml)" >> $GITHUB_OUTPUT
      - name: Run Ruff analysis
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version: ${{ steps.ruff-version.outputs.version }}
  codespell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: codespell-project/actions-codespell/codespell-problem-matcher@v2.4.3
      - name: Perform Codespell analysis
        continue-on-error: true
        run: uv tool run --python 3.13 --from codespell==2.4.3 codespell --count --check-filenames
  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript', 'python' ]
    steps:
    - uses: actions/checkout@v7.0.1
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4.39.3
      with:
        languages: ${{ matrix.language }}
    - name: Perform CodeQL analysis
      uses: github/codeql-action/analyze@v4.39.3
      with:
        category: "/language:${{matrix.language}}"
