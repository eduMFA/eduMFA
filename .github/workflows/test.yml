name: test

permissions:
  contents: read
  
on:
  push:
    branches: [ main ]
    paths:
    - '.github/workflows/test.yml'
    - 'edumfa/**/*.py'
    - 'tests/**'
    - 'tools/**'
    - 'edumfa-manage'
    - 'pyproject.toml'
    - 'setup.py'
  pull_request:
    types: [ opened, reopened, synchronize ]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.10', '3.14' ]
    name: pytest ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Setup UV
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --group test
      - name: Run Pytest checks
        run: uv run pytest --cov=edumfa --import-mode=importlib -vs -m "not dbcontainer" tests/
      - name: Codecov upload
        uses: codecov/codecov-action@v7.1.1
        with:
            token: ${{ secrets.CODECOV_TOKEN }}
            files: ./coverage.xml

  database-full-suite-postgres-17:
    runs-on: ubuntu-latest
    name: pytest postgres-17-psycopg2
    env: &postgres-test-env
      TEST_DATABASE_URL: postgresql+psycopg2://edumfa:edumfa@127.0.0.1:5432/edumfa
      DATABASE_EXTRA: postgres
    services:
      database:
        image: postgres:17-alpine@sha256:d3244e8ce3f165ee3c93d9c4a4b1d0fe48b3a89e2287b717fdcbbde92d405065
        env: &postgres-service-env
          POSTGRES_USER: edumfa
          POSTGRES_PASSWORD: edumfa
          POSTGRES_DB: edumfa
        ports: &postgres-ports
          - 5432:5432
        options: &postgres-health >-
          --health-cmd "pg_isready -U edumfa -d edumfa"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps: &database-test-steps
      - uses: actions/checkout@v7.0.1
      - name: Setup Python 3.14
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.14'
      - name: Setup UV
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Install PostgreSQL dependencies
        if: env.DATABASE_EXTRA == 'postgres'
        run: sudo apt-get install -y libpq-dev
      - name: Install dependencies
        run: uv sync --group test ${DATABASE_EXTRA:+--extra "$DATABASE_EXTRA"}
      - name: Run Pytest checks
        run: uv run pytest --import-mode=importlib -vs -m "not dbcontainer" tests/

  database-full-suite-postgres-18:
    runs-on: ubuntu-latest
    name: pytest postgres-18-psycopg2
    env: *postgres-test-env
    services:
      database:
        image: postgres:18-alpine@sha256:1018733457011bf88d81db98cf43aac6d5150afc18787dbe204771fedf80ff95
        env: *postgres-service-env
        ports: *postgres-ports
        options: *postgres-health
    steps: *database-test-steps

  database-full-suite-mariadb-11-5:
    runs-on: ubuntu-latest
    name: pytest mariadb-11.5
    env: &mariadb-test-env
      TEST_DATABASE_URL: mysql+pymysql://edumfa:edumfa@127.0.0.1:3306/edumfa
      EDUMFA_CONFIGFILE: ${{ github.workspace }}/tests/testdata/edumfa-mariadb.cfg
    services:
      database:
        # Keep testing MariaDB 11.5 to cover the replayability fix for
        # https://github.com/advisories/GHSA-qq2p-4282-cfc5.
        image: mariadb:11.5@sha256:2d50fe0f77dac919396091e527e5e148a9de690e58f32875f113bef6506a17f5
        env: &mariadb-service-env
          MARIADB_USER: edumfa
          MARIADB_PASSWORD: edumfa
          MARIADB_DATABASE: edumfa
          MARIADB_ROOT_PASSWORD: edumfa
        ports: &mariadb-ports
          - 3306:3306
        options: &mariadb-health >-
          --health-cmd "mariadb-admin ping -h 127.0.0.1 -uedumfa -pedumfa"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps: *database-test-steps

  database-full-suite-mariadb-11-8:
    runs-on: ubuntu-latest
    name: pytest mariadb-11.8
    env: *mariadb-test-env
    services:
      database:
        image: mariadb:11.8@sha256:d36f18d65a0459510b8b0f643b226a6d299e3206486e2b64ff20754a6d291707
        env: *mariadb-service-env
        ports: *mariadb-ports
        options: *mariadb-health
    steps: *database-test-steps

  database-full-suite-mariadb-12-3:
    runs-on: ubuntu-latest
    name: pytest mariadb-12.3
    env: *mariadb-test-env
    services:
      database:
        image: mariadb:12.3@sha256:4ebbcf100a3ba320766dfa0e1af008df12261301db6ef72798c7650f70794aed
        env: *mariadb-service-env
        ports: *mariadb-ports
        options: *mariadb-health
    steps: *database-test-steps

  database-backend-smoke:
    runs-on: ubuntu-latest
    name: testcontainers database smoke
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Setup Python 3.14
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.14'
      - name: Setup UV
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Install postgres dependencies
        run: sudo apt-get install -y libpq-dev
      - name: Install dependencies
        run: uv sync --group test --extra postgres
      - name: Run database backend checks
        run: uv run pytest --import-mode=importlib -vs -m dbcontainer tests/test_db_backends.py
